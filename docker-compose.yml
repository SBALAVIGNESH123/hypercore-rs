version: "3.8"

services:
  hypercore:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models
      - ./hypercore.yaml:/app/hypercore.yaml
    environment:
      - HYPERCORE_API_KEY=${HYPERCORE_API_KEY:-}
      - RUST_LOG=info
    command: ["serve", "--model", "/app/models/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
